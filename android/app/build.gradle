// Daybook for Android: a standalone app that shows https://mydeardaybook.netlify.app in its own
// WebView (no Chrome), and schedules reminders on the phone itself.
plugins {
    id 'com.android.application'
}

android {
    namespace "app.netlify.mydeardaybook"
    compileSdk 36

    defaultConfig {
        // Same package and signing key as the first (Chrome-based) version, so this installs as an update.
        applicationId "app.netlify.mydeardaybook"
        minSdk 29
        targetSdk 36
        versionCode 12
        versionName "3.0.0"
        buildConfigField "String", "SITE", '"https://mydeardaybook.netlify.app"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

// No libraries: everything uses the Android framework only.
dependencies {
}
